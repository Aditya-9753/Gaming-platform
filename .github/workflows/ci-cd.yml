name: CI and Render deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app
      - run: alembic history
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hooks
        env:
          API_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
          ENGINE_HOOK: ${{ secrets.RENDER_ENGINE_DEPLOY_HOOK }}
          CELERY_HOOK: ${{ secrets.RENDER_CELERY_DEPLOY_HOOK }}
          BEAT_HOOK: ${{ secrets.RENDER_CELERY_BEAT_DEPLOY_HOOK }}
          FRONTEND_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          set -eu
          for hook in "$API_HOOK" "$ENGINE_HOOK" "$CELERY_HOOK" "$BEAT_HOOK" "$FRONTEND_HOOK"; do
            if [ -n "$hook" ]; then
              curl --fail --silent --show-error --request POST "$hook"
            fi
          done
