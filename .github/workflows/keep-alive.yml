name: Keep backend awake

# Render's free plan puts the API to sleep after 15 idle minutes; the next visitor then waits
# up to a minute (and sees the "server is waking up" screen). A light health check every
# 10 minutes keeps it awake. Delete this file after moving to a paid plan.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: curl -fsS --max-time 90 --retry 2 --retry-delay 10 https://gaming-platform-1-nyum.onrender.com/health
