databases:
  - name: gaming-platform-db
    plan: basic-256mb
    databaseName: gaming_db
    user: gaming_app

services:
  - type: keyvalue
    name: gaming-platform-redis
    plan: starter
    ipAllowList: []

  - type: web
    name: gaming-platform-api
    runtime: docker
    autoDeploy: false
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars: &app-env
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: gaming-platform-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: gaming-platform-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CRICKET_DATA_URL
        sync: false
      - key: CRICKET_DATA_API_KEY
        sync: false
      - key: PII_ENCRYPTION_KEY
        sync: false
      - key: PAYMENT_WEBHOOK_SECRETS
        sync: false

  - type: worker
    name: gaming-platform-engine
    runtime: docker
    autoDeploy: false
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    startCommand: python -m app.games.base.engine
    envVars: *app-env

  - type: worker
    name: gaming-platform-celery
    runtime: docker
    autoDeploy: false
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    startCommand: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO
    envVars: *app-env

  - type: worker
    name: gaming-platform-celery-beat
    runtime: docker
    autoDeploy: false
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    startCommand: celery -A app.workers.celery_app:celery_app beat --loglevel=INFO
    envVars: *app-env

  - type: web
    name: gaming-platform-frontend
    runtime: static
    autoDeploy: false
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_WS_URL
        sync: false